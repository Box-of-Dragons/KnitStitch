<!DOCTYPE html>
<html lang="en-US">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>ReadMe - KnitStitch</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Dancing+Script:wght@700&family=Open+Sans:wght@400;600;700&family=Playfair+Display:wght@400;600&display=swap" rel="stylesheet">
  <script>
    (function () {
      var host = location.hostname;
      var isLocal = host === 'localhost' || host === '127.0.0.1' || host.indexOf('.ddev.site') !== -1;
      var version = 'knitstitch-header-20260808a';
      var liveHref = 'https://misssponto.me.uk/css/shared.css?v=' + version;
      var localHref = 'http://localhost:4000/css/shared.css?v=' + version;
      var link = document.createElement('link');
      var loaded = false;

      function useLiveFallback() {
        if (loaded || !isLocal || link.href === liveHref) return;
        link.href = liveHref;
      }

      link.rel = 'stylesheet';
      link.href = isLocal ? localHref : liveHref;
      link.onload = function () { loaded = true; };
      link.onerror = useLiveFallback;
      document.head.appendChild(link);

      if (isLocal) window.setTimeout(useLiveFallback, 1200);
    })();
  </script>
  <link rel="stylesheet" href="./css/site-shell.css">
  <link rel="shortcut icon" href="./img/cad/cube96.png">
</head>
<body class="page-knitstitch page-knitstitch-doc page-document page-readme" data-md-src="https://raw.githubusercontent.com/Box-of-Dragons/KnitStitch/js-ks/README.md">
  <script>window.SITE_HEADER = {
    brand: 'KnitStitch',
    nav: [
      {
        label: 'Home',
        localHref: './',
        liveHref: './'
      },
      {
        label: 'ReadMe',
        localHref: './readme.html',
        liveHref: './readme.html'
      },
      {
        label: 'Roadmap',
        localHref: './roadmap.html',
        liveHref: './roadmap.html'
      },
      {
        label: 'ChangeLog',
        localHref: './changelog.html',
        liveHref: './changelog.html'
      },
      {
        label: 'Branch Js-ks',
        localHref: '/js-ks/',
        liveHref: '/js-ks/'
      }
    ],
    github: 'https://github.com/Box-of-Dragons/KnitStitch',
    gitlab: 'https://gitlab.com/structured-chaos/KnitStitch'
  };</script>
  <div id="global-bar" data-active="knitstitch"></div>
  <script>
    (function () {
      var host = location.hostname;
      var isLocal = host === 'localhost' || host === '127.0.0.1' || host.indexOf('.ddev.site') !== -1;
      var version = 'knitstitch-header-20260808a';

      function loadSharedScript(file) {
        var loaded = false;
        var primary = (isLocal ? 'http://localhost:4000' : 'https://misssponto.me.uk') + '/js/' + file + '?v=' + version;
        var fallback = 'https://misssponto.me.uk/js/' + file + '?v=' + version;
        var script = document.createElement('script');

        function useLiveFallback() {
          if (loaded || !isLocal || script.src === fallback) return;
          var fallbackScript = document.createElement('script');
          fallbackScript.src = fallback;
          fallbackScript.defer = true;
          fallbackScript.async = false;
          document.head.appendChild(fallbackScript);
        }

        script.src = primary;
        script.defer = true;
        script.async = false;
        script.onload = function () { loaded = true; };
        script.onerror = useLiveFallback;
        document.head.appendChild(script);

        if (isLocal) window.setTimeout(useLiveFallback, 1200);
      }

      loadSharedScript('global-bar.js');
      loadSharedScript('site-header.js');
      loadSharedScript('site-footer.js');
    })();
  </script>
  <script src="./js/shared-shell-fallback.js" defer></script>
  <div id="site-header"></div>

  <main class="shell page-layout page-main">
    <div class="content-main">
      <div class="container">
        <div class="md-loading" id="md-loading">Loading README…</div>
        <div class="markdown-body" id="md-content"></div>
      </div>
    </div>
  </main>

  <script>window.SITE_FOOTER = { label: 'KnitStitch', buildInfoSrc: '/js/buildInfo.js' };</script>
  <div id="site-footer"></div>

  <script src="https://cdn.jsdelivr.net/npm/marked@12/marked.min.js"></script>
  <script src="./js/md-page.js"></script>
</body>
</html>
