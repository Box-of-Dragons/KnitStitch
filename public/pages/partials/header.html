<div id="global-bar" data-active="knitstitch"></div>
<script>
  (function () {
    var host = location.hostname;
    var isLocal = host === 'localhost' || host === '127.0.0.1' || host.indexOf('.ddev.site') !== -1;
    var base = (isLocal ? 'http://localhost:4000' : 'https://misssponto.me.uk') + '/js/';
    var pending = 2;
    function markHeaderAssetReady() {
      pending -= 1;
      if (pending <= 0) {
        window.dispatchEvent(new CustomEvent('knitstitch:shared-header-ready'));
      }
    }
    ['global-bar.js', 'site-header.js'].forEach(function (file) {
      var s = document.createElement('script');
      s.src = base + file;
      s.defer = true;
      s.addEventListener('load', markHeaderAssetReady);
      s.addEventListener('error', markHeaderAssetReady);
      document.head.appendChild(s);
    });
  })();
</script>
