name: Release

# Releases are always manual — Actions → Release → Run workflow.
# All release policy lives in the shared workflow (StructuredChaos docs/git-rules.md);
# this file only carries the KnitStitch-specific follow-on jobs.

on:
  workflow_dispatch:

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    uses: Box-of-Dragons/StructuredChaos/.github/workflows/family-release.yml@master
    with:
      release-branch: master
      project-description: KnitStitch, a knitting pattern design web app
    secrets: inherit

  desktop-release:
    needs: release
    if: needs.release.outputs.should_release == 'true'
    permissions:
      contents: write
    runs-on: windows-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build desktop package
        run: npm run electron:portable

      - name: Upload desktop release assets
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.release.outputs.release_tag }}
          files: release/KnitStitch-Portable-*.exe
          fail_on_unmatched_files: true

  # Deploy after release — the shared workflow has already merged dev→master.
  deploy:
    needs: release
    if: always() && !failure() && !cancelled()
    uses: Box-of-Dragons/StructuredChaos/.github/workflows/family-deploy.yml@master
    with:
      branch: master
    secrets: inherit
