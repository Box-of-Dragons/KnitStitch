name: Release

# Releases are always manual — Actions → Release → Run workflow.
# All release policy lives in the shared workflow (StructuredChaos docs/git-rules.md);
# this file only carries the KnitStitch-specific follow-on jobs.

on:
  workflow_dispatch:

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    uses: Box-of-Dragons/StructuredChaos/.github/workflows/family-release.yml@master
    with:
      project-description: KnitStitch, a knitting pattern design web app
    secrets: inherit

  # dev work reaches protected master only through a PR merge.
  sync:
    name: Sync release branch
    needs: release
    if: always() && github.ref_name == 'dev' && !failure() && !cancelled()
    permissions:
      contents: write
      pull-requests: write
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Merge dev into master via pull request
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git fetch origin master dev
          if [ "$(git rev-list --count origin/master..origin/dev)" -eq 0 ]; then
            echo "master already contains dev."
            exit 0
          fi
          gh pr create --base master --head dev \
            --title "chore(release): merge dev into master" \
            --body "Automated release sync." || true
          gh pr merge --merge dev || { sleep 5; gh pr merge --merge dev; }

  desktop-release:
    needs: release
    if: needs.release.outputs.should_release == 'true'
    permissions:
      contents: write
    runs-on: windows-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build desktop package
        run: npm run electron:portable

      - name: Upload desktop release assets
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.release.outputs.release_tag }}
          files: release/KnitStitch-Portable-*.exe
          fail_on_unmatched_files: true

  # Deploy after sync so the VPS always resets to the merged master.
  deploy:
    needs: [release, sync]
    if: always() && !failure() && !cancelled()
    uses: Box-of-Dragons/StructuredChaos/.github/workflows/family-deploy.yml@master
    with:
      branch: master
    secrets: inherit
